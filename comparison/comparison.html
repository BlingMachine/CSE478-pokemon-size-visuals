<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Size Comparison</title>
    <link rel="stylesheet" href="comparison.css">
</head>
<body>
    <h1>How Big Are Pokémon, Really?</h1>
    <p>Compare Pokémon to real-world animals and objects.</p>




    <div class="layout">

        <div class="controls">
            <label for="pokemonSearch">Search Pokémon:</label>
            <input type="text" id="pokemonSearch" placeholder="Enter Pokémon name...">

            <label for="pokemonSelect">Choose a Pokémon:</label>
            <select id="pokemonSelect" size="20"></select>
        </div>

        <div id="comparison"></div>

    </div>


    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="comparison.js"></script>
</body>
</html>
